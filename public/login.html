<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — The Little Spoon Admin</title>
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet" />
  <!-- Font Awesome for cute animated icons (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ---------- RESET & BASE ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #f9e0b0 0%, #f5cba0 40%, #e8b48c 80%, #d99b7a 100%);
      background-size: 300% 300%;
      animation: softFoodWave 16s ease-in-out infinite alternate;
    }

    @keyframes softFoodWave {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    /* ---------- ANIMATED FOOD BACKGROUND (Font Awesome icons) ---------- */
    .food-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .food-icon {
      position: absolute;
      font-size: 3.5rem;
      animation: floatFood 20s infinite alternate ease-in-out;
      opacity: 0.15;
      color: #5a4030;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.05));
    }

    .food-icon:nth-child(1) { top: 5%; left: 3%; animation-duration: 22s; opacity: 0.18; font-size: 4rem; }
    .food-icon:nth-child(2) { top: 78%; right: 2%; animation-duration: 26s; opacity: 0.14; font-size: 4.5rem; }
    .food-icon:nth-child(3) { top: 45%; right: 5%; animation-duration: 19s; opacity: 0.16; font-size: 3.8rem; }
    .food-icon:nth-child(4) { top: 12%; right: 15%; animation-duration: 24s; opacity: 0.13; font-size: 4.2rem; }
    .food-icon:nth-child(5) { bottom: 10%; left: 5%; animation-duration: 21s; opacity: 0.17; font-size: 3.5rem; }
    .food-icon:nth-child(6) { top: 55%; left: 2%; animation-duration: 23s; opacity: 0.19; font-size: 3.2rem; }
    .food-icon:nth-child(7) { top: 25%; left: 20%; animation-duration: 27s; opacity: 0.12; font-size: 4rem; }
    .food-icon:nth-child(8) { bottom: 22%; left: 45%; animation-duration: 25s; opacity: 0.11; font-size: 4.8rem; }
    .food-icon:nth-child(9) { top: 65%; left: 40%; animation-duration: 20s; opacity: 0.20; font-size: 3rem; }
    .food-icon:nth-child(10) { top: 8%; left: 45%; animation-duration: 28s; opacity: 0.10; font-size: 3.8rem; }
    .food-icon:nth-child(11) { bottom: 40%; right: 20%; animation-duration: 30s; opacity: 0.12; font-size: 4rem; }
    .food-icon:nth-child(12) { top: 35%; left: 10%; animation-duration: 18s; opacity: 0.15; font-size: 3.5rem; }

    @keyframes floatFood {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); }
      33% { transform: translate(30px, -40px) rotate(8deg) scale(1.1); }
      66% { transform: translate(-20px, 30px) rotate(-5deg) scale(0.95); }
      100% { transform: translate(15px, -15px) rotate(3deg) scale(1.05); }
    }

    /* ---------- CARD ---------- */
    .login-wrap {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
      animation: cardPop 0.7s cubic-bezier(0.23, 1, 0.32, 1);
    }

    @keyframes cardPop {
      0% { opacity: 0; transform: scale(0.96) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .card {
      background: rgba(255, 248, 235, 0.85);
      backdrop-filter: blur(16px) saturate(200%);
      -webkit-backdrop-filter: blur(16px) saturate(200%);
      border-radius: 48px 20px 48px 20px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 215, 150, 0.4);
      padding: 2rem 2rem 2.6rem;
      transition: 0.3s;
      border: 1px solid rgba(255, 225, 180, 0.5);
    }

    .login-card {
      text-align: center;
    }

    /* ---------- LOGO (big & nice) ---------- */
    .login-logo {
      margin: 0 auto 1.2rem;
      width: 140px;
      height: 140px;
      border-radius: 60% 40% 50% 50% / 45% 50% 50% 55%;
      background: rgba(255, 235, 200, 0.4);
      box-shadow: 0 12px 24px -8px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.25s;
      padding: 8px;
      backdrop-filter: blur(4px);
      border: 2px solid rgba(255, 215, 140, 0.5);
    }

    .login-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 40% 30% 50% 30% / 30% 50% 30% 50%;
      filter: drop-shadow(0 8px 12px rgba(100, 60, 20, 0.2));
      transition: 0.3s;
    }

    .login-logo img:hover {
      transform: scale(1.02) rotate(-2deg);
      filter: drop-shadow(0 12px 16px rgba(80, 40, 10, 0.25));
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #402e1b;
      margin-top: 0.2rem;
      margin-bottom: 0.1rem;
      text-shadow: 0 2px 6px rgba(255, 200, 120, 0.3);
    }

    .login-card p {
      color: #5a4030;
      font-weight: 400;
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 1.8rem;
    }

    /* ---------- FIELD ---------- */
    .field {
      text-align: left;
      margin-bottom: 1.2rem;
    }

    .field label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
      color: #3d2c1b;
      margin-bottom: 0.3rem;
      padding-left: 4px;
    }

    .field input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border: 2px solid rgba(200, 160, 120, 0.4);
      border-radius: 60px;
      background: rgba(255, 245, 225, 0.7);
      backdrop-filter: blur(4px);
      font-size: 1rem;
      transition: 0.2s;
      outline: none;
      color: #2a1e12;
      font-weight: 500;
    }

    .field input:focus {
      border-color: #c28a5c;
      background: rgba(255, 240, 215, 0.9);
      box-shadow: 0 0 0 6px rgba(194, 138, 92, 0.15);
    }

    .field input::placeholder {
      color: #b2967a;
      font-weight: 300;
      opacity: 0.7;
    }

    .error-text {
      color: #b35e3a;
      background: rgba(255, 220, 200, 0.4);
      padding: 0.3rem 0.6rem;
      border-radius: 40px;
      font-size: 0.85rem;
      min-height: 1.8rem;
      margin: 0.4rem 0 0.8rem;
      backdrop-filter: blur(4px);
      display: inline-block;
      width: auto;
      font-weight: 500;
    }

    /* ---------- BUTTON ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0.9rem 1.6rem;
      border: none;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1.05rem;
      background: #d9a77e;
      color: #271c12;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 18px -6px rgba(140, 90, 50, 0.3);
      border: 1px solid rgba(255, 215, 160, 0.5);
      letter-spacing: 0.3px;
    }

    .btn-primary {
      background: linear-gradient(145deg, #e8b88a, #d19f74);
      color: #241a10;
    }

    .btn-primary:hover {
      transform: scale(1.02) translateY(-3px);
      background: linear-gradient(145deg, #f0c89a, #d9a87a);
      box-shadow: 0 14px 26px -8px rgba(120, 70, 30, 0.4);
      border-color: #e8bf90;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn .material-symbols-outlined {
      font-size: 1.3rem;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 480px) {
      .login-logo {
        width: 110px;
        height: 110px;
      }
      h1 {
        font-size: 1.7rem;
      }
      .card {
        padding: 1.6rem 1.2rem 2rem;
        border-radius: 32px 16px 32px 16px;
      }
      .food-icon {
        font-size: 2.2rem !important;
      }
    }
  </style>
</head>
<body>

  <!-- ANIMATED FOOD BACKGROUND (Font Awesome icons from CDN - no emojis) -->
  <div class="food-bg">
    <i class="food-icon fa-solid fa-cake-candles"></i>
    <i class="food-icon fa-solid fa-ice-cream"></i>
    <i class="food-icon fa-solid fa-cookie"></i>
    <i class="food-icon fa-solid fa-candy-cane"></i>
    <i class="food-icon fa-solid fa-mug-saucer"></i>
    <i class="food-icon fa-solid fa-pizza-slice"></i>
    <i class="food-icon fa-solid fa-burger"></i>
    <i class="food-icon fa-solid fa-hotdog"></i>
    <i class="food-icon fa-solid fa-donut"></i>
    <i class="food-icon fa-solid fa-croissant"></i>
    <i class="food-icon fa-solid fa-bread"></i>
    <i class="food-icon fa-solid fa-wine-glass"></i>
  </div>

  <!-- LOGIN CARD -->
  <div class="login-wrap">
    <form class="card login-card" id="loginForm" autocomplete="off">
      <!-- BIG LOGO with your "logo.jpg" -->
      <div class="login-logo">
        <img src="logo.jpg" alt="The Little Spoon Logo" id="mainLogo" />
      </div>

      <h1>The Little Spoon</h1>
      <p>Espace administrateur</p>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>

      <p class="error-text" id="errorText"></p>

      <button type="submit" class="btn btn-primary" style="width:100%;" id="submitBtn">
        <span>Se connecter</span>
        <span class="material-symbols-outlined" style="font-size:18px;">arrow_forward</span>
      </button>
    </form>
  </div>

  <!-- AUTH SCRIPT -->
  <script>
    (function() {
      const form = document.getElementById('loginForm');
      const passwordInput = document.getElementById('password');
      const errorText = document.getElementById('errorText');

      passwordInput.addEventListener('input', () => {
        errorText.textContent = '';
      });

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const password = passwordInput.value.trim();

        if (!password) {
          errorText.textContent = '⚠️ Veuillez entrer le mot de passe.';
          return;
        }

        const adminPass = 'admin123';

        if (password === adminPass) {
          errorText.textContent = '✅ Connexion réussie ! (redirection simulée)';
          errorText.style.color = '#2b6e4a';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 900);
        } else {
          errorText.textContent = '❌ Mot de passe incorrect.';
          errorText.style.color = '#b35e3a';
          passwordInput.value = '';
          passwordInput.focus();
        }
      });

      // Fallback if logo.jpg fails
      const logoImg = document.getElementById('mainLogo');
      logoImg.addEventListener('error', function() {
        this.style.display = 'none';
        const fallback = document.createElement('span');
        fallback.textContent = '🥄';
        fallback.style.fontSize = '5rem';
        fallback.style.lineHeight = '1';
        this.parentElement.appendChild(fallback);
      });
    })();
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
