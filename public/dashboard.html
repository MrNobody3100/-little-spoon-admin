<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Little Spoon — Admin</title>

    <!-- Phosphor Icons -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

    <!-- Google Fonts : Inter + Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           THE LITTLE SPOON — Dashboard v3
           Colors & style aligned with categories.html
           Table + Grid view with image support
           ============================================================ */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #785460;
            --primary-container: #F4C6D4;
            --primary-dark: #E8A6BC;
            --primary-light: #F0E0E5;
            --secondary: #C9A97E;
            --secondary-light: #F5E6D6;
            --accent-rose: #E8C4CD;
            --accent-sage: #C5D5C5;
            --bg-warm: #FFF8F5;
            --surface: #FFFFFF;
            --surface-alt: #F8F2EE;
            --text-main: #3A2E2E;
            --text-muted: #8B7B7B;
            --text-light: #B5A5A5;
            --border-light: #EDE5E0;
            --shadow-sm: 0 2px 12px rgba(120, 84, 96, 0.06);
            --shadow-md: 0 8px 32px rgba(120, 84, 96, 0.10);
            --shadow-lg: 0 16px 56px rgba(120, 84, 96, 0.14);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 999px;
            --transition: 0.30s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-bounce: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-warm);
            color: var(--text-main);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(201, 169, 126, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(120, 84, 96, 0.04) 0%, transparent 50%);
            animation: pageFade 0.7s ease forwards;
        }

        @keyframes pageFade {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        a {
            color: inherit;
            text-decoration: none;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            font-size: inherit;
        }
        input,
        select,
        textarea {
            font-family: inherit;
            font-size: 16px;
        }

        /* ---------- Scrollbar ---------- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--border-light);
            border-radius: var(--radius-full);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: var(--radius-full);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* ============================================================
           SIDEBAR — exactly like categories.html
           ============================================================ */
        .sidebar {
            width: 270px;
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border-light);
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: var(--shadow-sm);
            overflow-y: auto;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }

        .sidebar-brand .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(120, 84, 96, 0.15);
            border: 2px solid var(--accent-rose);
        }

        .sidebar-brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .sidebar-brand h1 span {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 16px;
        }
        .sidebar-brand .sub {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-light);
            font-weight: 600;
            margin-top: 2px;
        }

        .nav-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px 0;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 14px;
            color: var(--text-muted);
            transition: all var(--transition);
            position: relative;
        }
        .nav-link i {
            width: 34px;
            height: 34px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--surface-alt);
            flex-shrink: 0;
            transition: all var(--transition);
        }
        .nav-link:hover {
            background: var(--surface-alt);
            color: var(--text-main);
        }
        .nav-link:hover i {
            background: var(--primary-light);
        }
        .nav-link.active {
            background: var(--primary-container);
            color: var(--primary);
            font-weight: 600;
        }
        .nav-link.active i {
            background: var(--surface);
            color: var(--primary);
        }
        .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 3px;
            border-radius: 0 4px 4px 0;
            background: var(--primary);
        }

        .sidebar-footer {
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .sidebar-footer .nav-link {
            font-size: 13px;
        }
        .sidebar-footer .nav-link.logout {
            color: var(--text-muted);
        }
        .sidebar-footer .nav-link.logout:hover {
            color: #c0392b;
            background: rgba(192, 57, 43, 0.06);
        }
        .sidebar-footer .nav-link.logout i {
            font-size: 16px;
        }

        /* ---------- Mobile toggle ---------- */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 200;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--surface);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
            color: var(--primary);
            font-size: 20px;
            transition: all var(--transition);
        }
        .sidebar-toggle:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-lg);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(45, 27, 27, 0.3);
            z-index: 90;
            backdrop-filter: blur(3px);
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .sidebar-overlay.show {
            opacity: 1;
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            flex: 1;
            margin-left: 270px;
            padding: 32px 44px 60px;
            max-width: 1280px;
            width: 100%;
            transition: margin 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow-x: hidden;
        }

        /* ---------- Header ---------- */
        .page-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-end;
            gap: 24px;
            margin-bottom: 28px;
        }

        .page-header-left h2 {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .page-header-left p {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 400;
            margin-top: 4px;
        }
        .page-header-left p i {
            animation: spinSlow 6s linear infinite;
        }
        @keyframes spinSlow {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .stat-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 16px 22px;
            min-width: 140px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            transition: all var(--transition-bounce);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(201, 169, 126, 0.04), transparent 70%);
            transition: opacity 0.6s;
            opacity: 0;
        }
        .stat-card:hover::after {
            opacity: 1;
        }
        .stat-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: var(--shadow-md);
            border-color: var(--accent-rose);
        }

        .stat-card .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-light);
            font-weight: 600;
        }
        .stat-card .stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 4px;
            line-height: 1.2;
            transition: all var(--transition);
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% {
                text-shadow: 0 0 0 rgba(120, 84, 96, 0);
            }
            100% {
                text-shadow: 0 0 12px rgba(120, 84, 96, 0.15);
            }
        }
        .stat-card .stat-value .stat-icon {
            font-size: 20px;
            color: var(--secondary);
            margin-right: 6px;
            opacity: 0.7;
        }

        .stat-card.today .stat-value {
            color: var(--secondary);
        }
        .stat-card.today .stat-value .stat-icon {
            color: var(--secondary);
        }

        /* ---------- Filter pills (Phosphor icons) ---------- */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
            padding-bottom: 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .filter-pill {
            padding: 10px 24px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 13px;
            background: var(--surface);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            transition: all var(--transition-bounce);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        .filter-pill i {
            font-size: 16px;
            opacity: 0.6;
            transition: transform var(--transition);
        }
        .filter-pill:hover {
            border-color: var(--secondary);
            color: var(--text-main);
            transform: translateY(-2px);
        }
        .filter-pill:hover i {
            transform: rotate(8deg) scale(1.1);
        }
        .filter-pill.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(120, 84, 96, 0.25);
        }
        .filter-pill.active i {
            opacity: 1;
            color: #fff;
            transform: scale(1.1);
        }
        .filter-pill .badge-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 0 10px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 700;
        }
        .filter-pill.active .badge-count {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ---------- View toggle ---------- */
        .view-toggle {
            display: flex;
            gap: 6px;
            background: var(--surface-alt);
            padding: 4px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-light);
            margin-bottom: 24px;
            flex-shrink: 0;
            width: fit-content;
        }
        .view-toggle button {
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .view-toggle button i {
            font-size: 18px;
        }
        .view-toggle button.active {
            background: var(--surface);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        .view-toggle button:hover:not(.active) {
            color: var(--text-main);
        }

        /* ---------- Orders container ---------- */
        .orders-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeUp 0.5s ease forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ----- TABLE VIEW (default) ----- */
        .orders-table-wrap {
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            overflow-x: auto;
            box-shadow: var(--shadow-sm);
        }
        .orders-table-wrap.hide {
            display: none;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 700px;
        }
        .orders-table th {
            background: var(--surface-alt);
            padding: 14px 18px;
            text-align: left;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }
        .orders-table td {
            padding: 14px 18px;
            border-top: 1px solid var(--border-light);
            vertical-align: middle;
        }
        .orders-table .order-thumb {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            background: var(--primary-container);
            display: block;
        }
        .orders-table .order-thumb-placeholder {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            background: var(--surface-alt);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-size: 20px;
        }
        .orders-table .order-name {
            font-weight: 600;
            color: var(--text-main);
        }
        .orders-table .order-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .orders-table .order-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .orders-table .order-meta i {
            font-size: 14px;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }
        .status-chip i {
            font-size: 14px;
        }
        .status-chip.new {
            background: #fde8e8;
            color: #c0392b;
        }
        .status-chip.new i {
            color: #e74c3c;
            animation: pulseDot 1.2s infinite;
        }
        .status-chip.confirmed {
            background: #fef5e7;
            color: #b7950b;
        }
        .status-chip.confirmed i {
            color: #f39c12;
        }
        .status-chip.ready {
            background: #ebf5fb;
            color: #1a5276;
        }
        .status-chip.ready i {
            color: #3498db;
        }
        .status-chip.delivered {
            background: #eafaf1;
            color: #1a7a4a;
        }
        .status-chip.delivered i {
            color: #27ae60;
        }

        @keyframes pulseDot {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.4);
                opacity: 0.6;
            }
        }

        /* ----- Order actions with Edit button ----- */
        .action-cell {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }
        .action-cell button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: var(--text-muted);
            transition: all var(--transition);
            border: 1px solid transparent;
        }
        .action-cell button:hover {
            background: var(--surface-alt);
            color: var(--primary);
        }
        .action-cell button.edit:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .action-cell button.delete:hover {
            background: #fde8e8;
            color: #c0392b;
        }
        .action-cell button i {
            font-size: 16px;
        }

        /* ----- GRID VIEW ----- */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            display: none;
        }
        .orders-grid.show {
            display: grid;
        }
        .orders-table-wrap.hide {
            display: none;
        }

        .order-grid-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: all var(--transition-bounce);
        }
        .order-grid-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent-rose);
        }
        .order-grid-card .grid-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: var(--primary-container);
        }
        .order-grid-card .grid-img-placeholder {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--surface-alt);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-size: 48px;
        }
        .order-grid-card .grid-body {
            padding: 16px;
        }
        .order-grid-card .grid-body .order-name {
            font-weight: 600;
            font-size: 16px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-grid-card .grid-body .order-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .order-grid-card .grid-body .order-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .order-grid-card .grid-body .order-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .order-grid-card .grid-body .order-actions button {
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            background: var(--surface-alt);
            color: var(--text-muted);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .order-grid-card .grid-body .order-actions button:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .order-grid-card .grid-body .order-actions button.edit:hover {
            background: var(--primary-container);
            color: var(--primary);
        }
        .order-grid-card .grid-body .order-actions button.delete:hover {
            background: #fde8e8;
            color: #c0392b;
        }

        /* ---------- Empty state ---------- */
        .empty-state {
            text-align: center;
            padding: 72px 32px;
            color: var(--text-muted);
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px dashed var(--border-light);
        }
        .empty-state i {
            font-size: 56px;
            color: var(--secondary);
            margin-bottom: 20px;
            display: block;
        }
        .empty-state h3 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 15px;
            max-width: 400px;
            margin: 0 auto;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .loading-state .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid var(--border-light);
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translate(-50%, 80px);
            background: var(--surface);
            padding: 16px 28px;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 14px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            border: 1px solid var(--border-light);
            font-weight: 500;
            font-size: 14px;
            pointer-events: none;
            max-width: 90vw;
        }
        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
            pointer-events: auto;
        }
        .toast i {
            font-size: 22px;
            color: var(--secondary);
        }
        .toast.success i {
            color: #27ae60;
        }
        .toast.error i {
            color: #e74c3c;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            .main-content {
                padding: 24px 28px 48px;
            }
            .stat-card {
                min-width: 120px;
                padding: 14px 18px;
            }
            .stat-card .stat-value {
                font-size: 26px;
            }
        }

        @media (max-width: 820px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay.show {
                display: block;
            }
            .sidebar-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .main-content {
                margin-left: 0;
                padding: 24px 20px 40px;
                padding-top: 76px;
            }
            .page-header {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            .stat-group {
                justify-content: flex-start;
            }
            .view-toggle {
                margin-bottom: 16px;
            }
            .orders-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .stat-group {
                flex-direction: column;
                width: 100%;
            }
            .stat-card {
                min-width: unset;
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 18px;
            }
            .stat-card .stat-value {
                font-size: 24px;
                margin-top: 0;
            }
            .stat-card .stat-label {
                font-size: 12px;
            }
            .page-header-left h2 {
                font-size: 28px;
            }
            .orders-grid {
                grid-template-columns: 1fr;
            }
            .toast {
                bottom: 16px;
                padding: 14px 20px;
                font-size: 13px;
                width: calc(100% - 32px);
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    SIDEBAR OVERLAY (mobile)
    ============================================================ -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ============================================================
    SIDEBAR
    ============================================================ -->
    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Navigation principale">
        <div class="sidebar-brand">
            <img src="logo.jpg" alt="The Little Spoon" class="brand-logo" />
            <div>
                <h1>The Little <span>Spoon</span></h1>
                <div class="sub">Administration</div>
            </div>
        </div>

        <div class="nav-list">
            <a href="dashboard.html" class="nav-link active">
                <i class="ph-fill ph-gauge"></i>
                <span>Commandes</span>
            </a>
            <a href="produits.html" class="nav-link">
                <i class="ph-fill ph-cake"></i>
                <span>Produits</span>
            </a>
            <a href="categories.html" class="nav-link">
                <i class="ph-fill ph-tag"></i>
                <span>Catégories</span>
            </a>
        </div>

        <div class="sidebar-footer">
            <a href="produits.html?new=1" class="nav-link" style="color:var(--primary);">
                <i class="ph-fill ph-plus-circle"></i>
                <span>Nouveau produit</span>
            </a>
            <a href="#" class="nav-link logout" onclick="logout(); return false;">
                <i class="ph-fill ph-sign-out"></i>
                <span>Déconnexion</span>
            </a>
        </div>
    </nav>

    <!-- ============================================================
    MOBILE TOGGLE
    ============================================================ -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Ouvrir le menu" aria-expanded="false">
        <i class="ph-bold ph-list"></i>
    </button>

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <main class="main-content" id="mainContent">

        <!-- Header -->
        <header class="page-header">
            <div class="page-header-left">
                <h2>Commandes</h2>
                <p><i class="ph ph-clock" style="margin-right:6px;opacity:0.6;"></i>Gérez les douceurs du jour</p>
            </div>
            <div class="stat-group">
                <div class="stat-card today">
                    <div class="stat-label">
                        <i class="ph ph-calendar-plus" style="margin-right:4px;"></i> Aujourd'hui
                    </div>
                    <div class="stat-value">
                        <span class="stat-icon" aria-hidden="true"><i class="ph ph-clock"></i></span>
                        <span id="statNewNumber">—</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">
                        <i class="ph ph-list" style="margin-right:4px;"></i> Total
                    </div>
                    <div class="stat-value">
                        <span class="stat-icon" aria-hidden="true"><i class="ph ph-list"></i></span>
                        <span id="statTotalNumber">—</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Filters -->
        <div class="filter-bar" id="filterBar" role="tablist" aria-label="Filtrer par statut">
            <button class="filter-pill active" data-status="all" role="tab" aria-selected="true">
                <i class="ph ph-circle"></i> Toutes
                <span class="badge-count" id="countAll">0</span>
            </button>
            <button class="filter-pill" data-status="nouvelle" role="tab" aria-selected="false">
                <i class="ph ph-circle-wavy-warning"></i> Nouvelles
                <span class="badge-count" id="countNouvelle">0</span>
            </button>
            <button class="filter-pill" data-status="confirmée" role="tab" aria-selected="false">
                <i class="ph ph-check-circle"></i> Confirmées
                <span class="badge-count" id="countConfirmée">0</span>
            </button>
            <button class="filter-pill" data-status="prête" role="tab" aria-selected="false">
                <i class="ph ph-check-circle"></i> Prêtes
                <span class="badge-count" id="countPrête">0</span>
            </button>
            <button class="filter-pill" data-status="livrée" role="tab" aria-selected="false">
                <i class="ph ph-check-circle"></i> Livrées
                <span class="badge-count" id="countLivrée">0</span>
            </button>
        </div>

        <!-- View toggle -->
        <div class="view-toggle" id="viewToggle">
            <button class="active" data-view="table" title="Vue tableau">
                <i class="ph-bold ph-table"></i> Tableau
            </button>
            <button data-view="grid" title="Vue grille">
                <i class="ph-bold ph-grid-four"></i> Grille
            </button>
        </div>

        <!-- Orders list -->
        <section id="ordersList" aria-label="Liste des commandes">
            <!-- Table view (default) -->
            <div class="orders-table-wrap" id="ordersTableWrap">
                <div id="ordersTableContainer">
                    <div class="loading-state">
                        <div class="spinner" aria-hidden="true"></div>
                        <p>Chargement des commandes…</p>
                    </div>
                </div>
            </div>
            <!-- Grid view (hidden) -->
            <div class="orders-grid" id="ordersGridContainer">
                <!-- populated by JS -->
            </div>
        </section>

    </main>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div class="toast" id="toast" role="alert" aria-live="polite">
        <i class="ph ph-check-circle" aria-hidden="true"></i>
        <span id="toastText">Statut mis à jour</span>
    </div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="js/auth-check.js"></script>
    <script src="js/commandes.js"></script>

    <script>
        // ============================================================
        // SIDEBAR TOGGLE (mobile) — untouched
        // ============================================================
        (function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const toggleBtn = document.getElementById('sidebarToggle');

            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('show');
                toggleBtn.setAttribute('aria-expanded', 'true');
                toggleBtn.innerHTML = '<i class="ph-bold ph-x"></i>';
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
                toggleBtn.setAttribute('aria-expanded', 'false');
                toggleBtn.innerHTML = '<i class="ph-bold ph-list"></i>';
                document.body.style.overflow = '';
            }

            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (sidebar.classList.contains('open')) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            });

            overlay.addEventListener('click', closeSidebar);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && sidebar.classList.contains('open')) {
                    closeSidebar();
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 820 && sidebar.classList.contains('open')) {
                    closeSidebar();
                }
            });

            document.querySelectorAll('.nav-link').forEach(function(link) {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 820) {
                        closeSidebar();
                    }
                });
            });
        })();

        // ============================================================
        // VIEW TOGGLE (Table / Grid) — CSS only, no logic change
        // ============================================================
        (function() {
            const toggleBtns = document.querySelectorAll('#viewToggle button');
            const tableWrap = document.getElementById('ordersTableWrap');
            const gridContainer = document.getElementById('ordersGridContainer');

            toggleBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    toggleBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    if (this.dataset.view === 'table') {
                        tableWrap.classList.remove('hide');
                        gridContainer.classList.remove('show');
                    } else {
                        tableWrap.classList.add('hide');
                        gridContainer.classList.add('show');
                    }
                });
            });
        })();

        // ============================================================
        // FILTER PILLS — sync with commandes.js (unchanged)
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('ordersUpdated', function(e) {
                const counts = e.detail.counts || {};
                document.getElementById('countAll').textContent = counts.all || 0;
                document.getElementById('countNouvelle').textContent = counts.nouvelle || 0;
                document.getElementById('countConfirmée').textContent = counts.confirmée || 0;
                document.getElementById('countPrête').textContent = counts.prête || 0;
                document.getElementById('countLivrée').textContent = counts.livrée || 0;
            });

            document.addEventListener('statsUpdated', function(e) {
                const stats = e.detail || {};
                document.getElementById('statNewNumber').textContent = stats.newToday !== undefined ? stats.newToday :
                    '—';
                document.getElementById('statTotalNumber').textContent = stats.total !== undefined ? stats.total : '—';
            });
        });

        // ============================================================
        // TOAST helper (unchanged)
        // ============================================================
        function showToast(message, type) {
            type = type || 'success';
            const toast = document.getElementById('toast');
            const text = document.getElementById('toastText');
            const icon = toast.querySelector('i');

            text.textContent = message;

            if (type === 'success') {
                icon.className = 'ph ph-check-circle';
                toast.className = 'toast success';
            } else if (type === 'error') {
                icon.className = 'ph ph-x-circle';
                toast.className = 'toast error';
            } else {
                icon.className = 'ph ph-info';
                toast.className = 'toast';
            }

            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(function() {
                toast.classList.remove('show');
            }, 3000);
        }
        window.showToast = showToast;

        // ============================================================
        // LOGOUT (unchanged)
        // ============================================================
        function logout() {
            if (confirm('Voulez-vous vraiment vous déconnecter ?')) {
                localStorage.removeItem('authToken');
                sessionStorage.removeItem('authToken');
                window.location.href = 'login.html';
            }
        }
        window.logout = logout;

        // ============================================================
        // GRID VIEW RENDER — listens for ordersRendered event from commandes.js
        // ============================================================
        document.addEventListener('ordersRendered', function(e) {
            const orders = e.detail.orders;
            if (!orders || orders.length === 0) {
                document.getElementById('ordersGridContainer').innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <i class="ph ph-list"></i>
                        <h3>Aucune commande</h3>
                        <p>Les commandes apparaîtront ici.</p>
                    </div>
                `;
                return;
            }
            renderGrid(orders);
        });

        function renderGrid(orders) {
            const container = document.getElementById('ordersGridContainer');
            let html = '';
            orders.forEach(order => {
                const statusClass = order.status || 'nouvelle';
                const statusLabel = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);
                const imageUrl = order.image_url || '';
                const name = order.product_name || order.name || 'Commande';
                const total = order.total || order.price || 0;
                const date = order.created_at ? new Date(order.created_at).toLocaleDateString('fr-FR') : '';

                html += `
                    <div class="order-grid-card">
                        ${imageUrl ? `<img src="${imageUrl}" alt="${name}" class="grid-img" />` : 
                            `<div class="grid-img-placeholder"><i class="ph ph-image"></i></div>`}
                        <div class="grid-body">
                            <div class="order-name">
                                <span>${escapeHtml(name)}</span>
                                <span class="status-chip ${statusClass}"><i class="ph ph-circle-fill"></i>${statusLabel}</span>
                            </div>
                            <div class="order-meta">
                                <span><i class="ph ph-currency-dzd"></i> ${total} DA</span>
                                ${date ? `<span><i class="ph ph-calendar"></i> ${date}</span>` : ''}
                                <span><i class="ph ph-user"></i> ${escapeHtml(order.customer_name || 'Client')}</span>
                            </div>
                            <div class="order-actions">
                                <button class="edit" onclick="editOrder('${order.id}')" title="Modifier">
                                    <i class="ph ph-pencil"></i> Modifier
                                </button>
                                <button class="delete" onclick="deleteOrder('${order.id}')" title="Supprimer">
                                    <i class="ph ph-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // EDIT & DELETE placeholders — just the icon, no logic yet
        // ============================================================
        function editOrder(id) {
            showToast('Fonctionnalité d\'édition à venir', 'info');
        }
        window.editOrder = editOrder;

        function deleteOrder(id) {
            if (!confirm('Supprimer cette commande ?')) return;
            showToast('Suppression à implémenter', 'error');
        }
        window.deleteOrder = deleteOrder;

        // ============================================================
        // Add edit buttons to existing table rows (after commandes.js renders)
        // ============================================================
        function addEditButtonsToTable() {
            const rows = document.querySelectorAll('#ordersTableContainer .order-row, #ordersTableContainer tr');
            rows.forEach(row => {
                const actionCell = row.querySelector('.action-cell');
                if (actionCell && !actionCell.querySelector('.edit')) {
                    const editBtn = document.createElement('button');
                    editBtn.className = 'edit';
                    editBtn.title = 'Modifier';
                    editBtn.innerHTML = '<i class="ph ph-pencil"></i>';
                    editBtn.onclick = function() {
                        const id = row.dataset.orderId || 'unknown';
                        editOrder(id);
                    };
                    // Insert before delete button
                    const deleteBtn = actionCell.querySelector('.delete');
                    if (deleteBtn) {
                        actionCell.insertBefore(editBtn, deleteBtn);
                    } else {
                        actionCell.appendChild(editBtn);
                    }
                }
            });
        }

        // Observe orders container for changes (when commandes.js renders)
        const observer = new MutationObserver(function() {
            addEditButtonsToTable();
        });
        const container = document.getElementById('ordersTableContainer');
        if (container) {
            observer.observe(container, { childList: true, subtree: true });
        }

        // Also run after a short delay on page load
        setTimeout(addEditButtonsToTable, 500);
    </script>

</body>
</html>
