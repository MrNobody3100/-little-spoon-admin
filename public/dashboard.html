<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Little Spoon — Commandes</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f0ed;
            color: #2d1f1f;
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #7c4f5e;
        }

        .header h1 span {
            font-weight: 400;
            color: #b59595;
        }

        .stats {
            display: flex;
            gap: 16px;
        }

        .stat {
            background: white;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(124, 79, 94, 0.08);
            border: 1px solid #e8ddd8;
            text-align: center;
        }

        .stat .label {
            font-size: 11px;
            text-transform: uppercase;
            color: #b59595;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .stat .value {
            font-size: 28px;
            font-weight: 700;
            color: #7c4f5e;
            font-family: 'Playfair Display', serif;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter {
            padding: 8px 20px;
            border-radius: 999px;
            border: 1px solid #e8ddd8;
            background: white;
            font-weight: 600;
            font-size: 13px;
            color: #8b7a7a;
            cursor: pointer;
            transition: all 0.25s;
        }

        .filter:hover {
            border-color: #c9a97e;
            transform: translateY(-2px);
        }

        .filter.active {
            background: #7c4f5e;
            color: white;
            border-color: #7c4f5e;
        }

        .filter .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 0 10px;
            border-radius: 999px;
            font-size: 11px;
            margin-left: 6px;
        }

        .filter.active .badge {
            background: rgba(255, 255, 255, 0.25);
        }

        /* TABLE */
        .table-wrap {
            background: white;
            border-radius: 16px;
            border: 1px solid #e8ddd8;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(124, 79, 94, 0.06);
        }

        .table-scroll {
            overflow-x: auto;
            padding: 0 4px 4px 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 650px;
        }

        thead th {
            text-align: left;
            padding: 16px 20px 12px 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #b59595;
            font-weight: 600;
            border-bottom: 1px solid #e8ddd8;
            background: #faf7f5;
        }

        tbody tr {
            border-bottom: 1px solid #f0eae6;
            transition: all 0.3s ease;
            position: relative;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        /* --- LE BON EFFET HOVER AVEC FLOU --- */
        tbody tr:hover {
            background: #faf7f5;
            box-shadow: 0 4px 20px rgba(124, 79, 94, 0.08);
            transform: scale(1.003);
            backdrop-filter: blur(2px);
        }

        tbody td {
            padding: 14px 20px;
            vertical-align: middle;
        }

        /* Colonne Commande */
        .col-order {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .col-order .icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #f4e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #7c4f5e;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        tbody tr:hover .icon {
            transform: scale(1.08) rotate(-4deg);
            background: #e8d4d4;
        }

        .col-order .name {
            font-weight: 600;
            color: #2d1f1f;
        }

        .col-order .id {
            font-size: 11px;
            color: #b59595;
            background: #f5f0ed;
            padding: 2px 10px;
            border-radius: 999px;
            font-family: monospace;
            margin-left: 8px;
        }

        .col-order .meta {
            font-size: 12px;
            color: #b59595;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 2px;
        }

        .col-order .meta i {
            font-size: 12px;
        }

        tbody tr:hover .meta i {
            color: #7c4f5e;
        }

        /* Status */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .status.new {
            background: #fde8e8;
            color: #b03a2e;
        }
        .status.new i {
            color: #e74c3c;
            animation: pulse 1.2s infinite;
        }

        .status.confirmed {
            background: #fef5e7;
            color: #a67c1e;
        }
        .status.confirmed i {
            color: #f39c12;
        }

        .status.ready {
            background: #ebf5fb;
            color: #1a5276;
        }
        .status.ready i {
            color: #3498db;
        }

        .status.delivered {
            background: #eafaf1;
            color: #1a7a4a;
        }
        .status.delivered i {
            color: #27ae60;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .actions button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #f5f0ed;
            color: #8b7a7a;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .actions button:hover {
            background: #f4e8e8;
            color: #7c4f5e;
            transform: scale(1.1) rotate(6deg);
            box-shadow: 0 4px 12px rgba(124, 79, 94, 0.12);
        }

        .actions button.primary {
            background: #7c4f5e;
            color: white;
        }

        .actions button.primary:hover {
            background: #5c3a46;
            transform: scale(1.1);
        }

        .actions button.danger:hover {
            background: #fde8e8;
            color: #b03a2e;
        }

        /* Empty state */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #b59595;
        }

        .empty i {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
            color: #e8ddd8;
        }

        .empty h3 {
            font-family: 'Playfair Display', serif;
            color: #2d1f1f;
            margin-bottom: 8px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 48px;
            color: #b59595;
        }

        .loading .spinner {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid #e8ddd8;
            border-top-color: #7c4f5e;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 700px) {
            body { padding: 16px; }
            .header { flex-direction: column; align-items: stretch; }
            .stats { flex-wrap: wrap; }
            .stat { flex: 1; min-width: 100px; padding: 10px 16px; }
            .stat .value { font-size: 22px; }
            table { font-size: 13px; min-width: 550px; }
            thead th, tbody td { padding: 10px 12px; }
        }

        @media (max-width: 480px) {
            .stat { min-width: 80px; padding: 8px 12px; }
            .stat .value { font-size: 18px; }
            .col-order .icon { width: 34px; height: 34px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>Commandes <span>· The Little Spoon</span></h1>
        <div class="stats">
            <div class="stat">
                <div class="label">Aujourd'hui</div>
                <div class="value" id="todayCount">—</div>
            </div>
            <div class="stat">
                <div class="label">Total</div>
                <div class="value" id="totalCount">—</div>
            </div>
        </div>
    </div>

    <!-- FILTERS -->
    <div class="filters" id="filters">
        <button class="filter active" data-status="all">
            Toutes <span class="badge" id="badgeAll">0</span>
        </button>
        <button class="filter" data-status="new">
            <i class="fa-regular fa-circle-exclamation"></i> Nouvelles
            <span class="badge" id="badgeNew">0</span>
        </button>
        <button class="filter" data-status="confirmed">
            <i class="fa-regular fa-circle-check"></i> Confirmées
            <span class="badge" id="badgeConfirmed">0</span>
        </button>
        <button class="filter" data-status="ready">
            <i class="fa-regular fa-circle-check"></i> Prêtes
            <span class="badge" id="badgeReady">0</span>
        </button>
        <button class="filter" data-status="delivered">
            <i class="fa-regular fa-circle-check"></i> Livrées
            <span class="badge" id="badgeDelivered">0</span>
        </button>
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
        <div class="table-scroll">
            <div id="loadingState" class="loading">
                <div class="spinner"></div>
                <p>Chargement des commandes…</p>
            </div>

            <div id="tableWrapper" style="display:none;">
                <table>
                    <thead>
                        <tr>
                            <th>Commande</th>
                            <th>Statut</th>
                            <th>Date</th>
                            <th style="text-align:right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody"></tbody>
                </table>
            </div>

            <div id="emptyState" style="display:none;" class="empty">
                <i class="fa-regular fa-rectangle-list"></i>
                <h3>Aucune commande</h3>
                <p>Aucune commande pour le moment.</p>
            </div>
        </div>
    </div>

</div>

<script>
    // ============================================================
    // DONNÉES EXEMPLE
    // ============================================================
    const sampleOrders = [
        { id: 'LS-001', product: 'Gâteau au chocolat', client: 'Marie D.', status: 'new', date: '2026-09-02 10:30', icon: 'fa-regular fa-cake' },
        { id: 'LS-002', product: 'Macarons assortis', client: 'Jean P.', status: 'confirmed', date: '2026-09-02 09:15', icon: 'fa-regular fa-cookie' },
        { id: 'LS-003', product: 'Tarte aux fruits', client: 'Sophie L.', status: 'ready', date: '2026-09-01 16:45', icon: 'fa-regular fa-fruit' },
        { id: 'LS-004', product: 'Éclair au café', client: 'Pierre R.', status: 'delivered', date: '2026-09-01 14:20', icon: 'fa-regular fa-mug-saucer' },
        { id: 'LS-005', product: 'Mille-feuille', client: 'Claire M.', status: 'new', date: '2026-09-02 11:00', icon: 'fa-regular fa-layer-group' },
        { id: 'LS-006', product: 'Pain d\'épices', client: 'Lucas B.', status: 'confirmed', date: '2026-09-01 12:10', icon: 'fa-regular fa-bread' },
        { id: 'LS-007', product: 'Financiers', client: 'Emma S.', status: 'ready', date: '2026-09-02 08:50', icon: 'fa-regular fa-square' },
    ];

    // ============================================================
    // ÉTAT
    // ============================================================
    let orders = [...sampleOrders];
    let currentFilter = 'all';

    // ============================================================
    // RENDU
    // ============================================================
    function render() {
        const filtered = currentFilter === 'all'
            ? orders
            : orders.filter(o => o.status === currentFilter);

        const tbody = document.getElementById('ordersBody');
        const loading = document.getElementById('loadingState');
        const tableWrap = document.getElementById('tableWrapper');
        const empty = document.getElementById('emptyState');

        // Stats
        const today = orders.filter(o => o.date.startsWith('2026-09-02'));
        document.getElementById('todayCount').textContent = today.length;
        document.getElementById('totalCount').textContent = orders.length;

        // Badges
        const counts = {
            all: orders.length,
            new: orders.filter(o => o.status === 'new').length,
            confirmed: orders.filter(o => o.status === 'confirmed').length,
            ready: orders.filter(o => o.status === 'ready').length,
            delivered: orders.filter(o => o.status === 'delivered').length,
        };
        document.getElementById('badgeAll').textContent = counts.all;
        document.getElementById('badgeNew').textContent = counts.new;
        document.getElementById('badgeConfirmed').textContent = counts.confirmed;
        document.getElementById('badgeReady').textContent = counts.ready;
        document.getElementById('badgeDelivered').textContent = counts.delivered;

        // Hide loading
        loading.style.display = 'none';

        if (filtered.length === 0) {
            tableWrap.style.display = 'none';
            empty.style.display = 'block';
            return;
        }

        tableWrap.style.display = 'block';
        empty.style.display = 'none';

        const statusLabels = {
            new: 'Nouvelle',
            confirmed: 'Confirmée',
            ready: 'Prête',
            delivered: 'Livrée'
        };

        const statusIcons = {
            new: 'fa-regular fa-circle-exclamation',
            confirmed: 'fa-regular fa-circle-check',
            ready: 'fa-regular fa-circle-check',
            delivered: 'fa-regular fa-circle-check'
        };

        tbody.innerHTML = filtered.map(o => `
            <tr>
                <td>
                    <div class="col-order">
                        <div class="icon"><i class="${o.icon}"></i></div>
                        <div>
                            <div>
                                <span class="name">${o.product}</span>
                                <span class="id">${o.id}</span>
                            </div>
                            <div class="meta">
                                <span><i class="fa-regular fa-user"></i> ${o.client}</span>
                            </div>
                        </div>
                    </div>
                </td>
                <td>
                    <span class="status ${o.status}">
                        <i class="${statusIcons[o.status]}"></i> ${statusLabels[o.status]}
                    </span>
                </td>
                <td>${o.date}</td>
                <td>
                    <div class="actions">
                        <button class="primary" onclick="updateStatus('${o.id}', 'confirmed')" title="Confirmer">
                            <i class="fa-regular fa-check"></i>
                        </button>
                        <button onclick="updateStatus('${o.id}', 'ready')" title="Prêt">
                            <i class="fa-regular fa-clock"></i>
                        </button>
                        <button onclick="updateStatus('${o.id}', 'delivered')" title="Livré">
                            <i class="fa-regular fa-truck"></i>
                        </button>
                        <button class="danger" onclick="deleteOrder('${o.id}')" title="Supprimer">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    // ============================================================
    // ACTIONS
    // ============================================================
    function updateStatus(id, newStatus) {
        const order = orders.find(o => o.id === id);
        if (order) {
            order.status = newStatus;
            render();
            showToast(`Commande ${id} → ${newStatus}`, 'success');
        }
    }

    function deleteOrder(id) {
        if (confirm(`Supprimer la commande ${id} ?`)) {
            orders = orders.filter(o => o.id !== id);
            render();
            showToast(`Commande ${id} supprimée`, 'success');
        }
    }

    // ============================================================
    // FILTRES
    // ============================================================
    document.querySelectorAll('.filter').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.status;
            render();
        });
    });

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(msg, type) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.cssText = `
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: white; padding: 12px 28px; border-radius: 999px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12); border: 1px solid #e8ddd8;
            display: flex; align-items: center; gap: 12px;
            font-size: 14px; font-weight: 500; z-index: 999;
            opacity: 0; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: ${type === 'success' ? '#1a7a4a' : '#2d1f1f'};
        `;
        toast.innerHTML = `
            <i class="fa-regular ${type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}" 
               style="color:${type === 'success' ? '#27ae60' : '#7c4f5e'}; font-size:20px;"></i>
            ${msg}
        `;
        document.body.appendChild(toast);

        requestAnimationFrame(() => toast.style.opacity = '1');

        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 400);
        }, 3000);
    }

    // ============================================================
    // INIT
    // ============================================================
    render();
</script>

</body>
</html>
