<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Little Spoon — Commandes</title>

    <!-- Phosphor Icons -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #785460;
            --primary-container: #F4C6D4;
            --primary-dark: #E8A6BC;
            --primary-light: #F0E0E5;
            --secondary: #C9A97E;
            --secondary-light: #F5E6D6;
            --accent-rose: #E8C4CD;
            --accent-sage: #C5D5C5;
            --bg-warm: #FFF8F5;
            --surface: #FFFFFF;
            --surface-alt: #F8F2EE;
            --text-main: #3A2E2E;
            --text-muted: #8B7B7B;
            --text-light: #B5A5A5;
            --border-light: #EDE5E0;
            --shadow-sm: 0 2px 12px rgba(120, 84, 96, 0.06);
            --shadow-md: 0 8px 32px rgba(120, 84, 96, 0.10);
            --shadow-lg: 0 16px 56px rgba(120, 84, 96, 0.14);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 999px;
            --transition: 0.30s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-bounce: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-warm);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(201, 169, 126, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(120, 84, 96, 0.04) 0%, transparent 50%);
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; font-size: inherit; }
        input, select, textarea { font-family: inherit; font-size: 16px; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--border-light); border-radius: var(--radius-full); }
        ::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: var(--radius-full); }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* ============================================================
           SIDEBAR (identique à categories.html / produits.html)
           ============================================================ */
        .sidebar {
            width: 270px;
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border-light);
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: var(--shadow-sm);
            overflow-y: auto;
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }
        .sidebar-brand .brand-logo {
            width: 48px; height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(120, 84, 96, 0.15);
            border: 2px solid var(--accent-rose);
        }
        .sidebar-brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .sidebar-brand h1 span { font-weight: 400; color: var(--text-muted); font-size: 16px; }
        .sidebar-brand .sub {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-light);
            font-weight: 600;
            margin-top: 2px;
        }
        .nav-list { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 8px 0; }
        .nav-link {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-weight: 500; font-size: 14px;
            color: var(--text-muted);
            transition: all var(--transition);
            position: relative;
        }
        .nav-link i {
            width: 34px; height: 34px; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            background: var(--surface-alt);
            flex-shrink: 0;
            transition: all var(--transition);
        }
        .nav-link:hover { background: var(--surface-alt); color: var(--text-main); }
        .nav-link:hover i { background: var(--primary-light); }
        .nav-link.active { background: var(--primary-container); color: var(--primary); font-weight: 600; }
        .nav-link.active i { background: var(--surface); color: var(--primary); }
        .nav-link.active::before {
            content: '';
            position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
            border-radius: 0 4px 4px 0;
            background: var(--primary);
        }
        .sidebar-footer {
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
            display: flex; flex-direction: column; gap: 4px;
            flex-shrink: 0;
        }
        .sidebar-footer .nav-link { font-size: 13px; }
        .sidebar-footer .nav-link.logout { color: var(--text-muted); }
        .sidebar-footer .nav-link.logout:hover { color: #c0392b; background: rgba(192, 57, 43, 0.06); }

        .sidebar-toggle {
            display: none;
            position: fixed; top: 16px; left: 16px; z-index: 200;
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--surface);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
            color: var(--primary); font-size: 20px;
            align-items: center; justify-content: center;
            transition: all var(--transition);
        }
        .sidebar-toggle:hover { transform: scale(1.05); box-shadow: var(--shadow-lg); }
        .sidebar-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(45, 27, 27, 0.3);
            z-index: 90;
            backdrop-filter: blur(3px);
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .sidebar-overlay.show { opacity: 1; }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            margin-left: 270px;
            padding: 32px 44px 60px;
            max-width: calc(100% - 270px);
            width: 100%;
        }

        .page-header {
            display: flex; flex-wrap: wrap;
            justify-content: space-between; align-items: flex-end;
            gap: 24px; margin-bottom: 28px;
        }
        .page-header-left h2 {
            font-family: 'Playfair Display', serif;
            font-size: 34px; font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .page-header-left p {
            color: var(--text-muted);
            font-size: 15px;
            margin-top: 4px;
            display: flex; align-items: center; gap: 6px;
        }

        .stat-group { display: flex; gap: 16px; flex-wrap: wrap; }
        .stat-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 14px 22px;
            min-width: 130px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            text-align: center;
            transition: box-shadow var(--transition);
        }
        .stat-card:hover { box-shadow: var(--shadow-md); }
        .stat-card .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-light);
            font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .stat-card .stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 4px;
        }
        .stat-card.today .stat-value { color: var(--secondary); }

        /* ---------- Filter pills ---------- */
        .filter-bar {
            display: flex; flex-wrap: wrap; gap: 10px;
            margin-bottom: 24px;
            overflow-x: auto;
        }
        .filter-pill {
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-weight: 600; font-size: 13px;
            background: var(--surface);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            transition: all var(--transition);
            white-space: nowrap;
            display: flex; align-items: center; gap: 8px;
        }
        .filter-pill i { font-size: 13px; opacity: 0.7; }
        .filter-pill:hover { border-color: var(--primary-container); color: var(--text-main); }
        .filter-pill.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(120, 84, 96, 0.25);
        }
        .filter-pill.active i { opacity: 1; }
        .filter-pill .badge-count {
            background: rgba(255, 255, 255, 0.25);
            padding: 0 9px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 700;
        }
        .filter-pill:not(.active) .badge-count { background: var(--surface-alt); color: var(--text-muted); }

        /* ---------- Orders table ---------- */
        .table-scroll {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow-x: auto;
        }
        .orders-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 780px;
        }
        .orders-table th {
            padding: 14px 20px;
            background: var(--surface-alt);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
            white-space: nowrap;
        }
        .orders-table td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
            font-size: 13px;
        }
        .orders-table tbody tr:last-child td { border-bottom: none; }
        .orders-table tbody tr { transition: background var(--transition); }
        .orders-table tbody tr:hover td { background: var(--surface-alt); }

        .order-client { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .order-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--primary-container);
            color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        .order-client-info { min-width: 0; }
        .order-name { font-weight: 700; color: var(--text-main); }
        .order-sub {
            font-size: 12px; color: var(--text-muted);
            display: flex; align-items: center; gap: 5px;
            margin-top: 2px;
        }
        .order-sub i { font-size: 12px; opacity: 0.7; flex-shrink: 0; }
        .order-message {
            max-width: 220px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .order-product { font-weight: 600; color: var(--text-main); }

        .status-chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 14px;
            border-radius: var(--radius-full);
            font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.05em;
            white-space: nowrap;
        }
        .status-chip i { font-size: 12px; }
        .status-chip.status-new { background: #fde8e8; color: #c0392b; }
        .status-chip.status-confirmed { background: #fef5e7; color: #b7950b; }
        .status-chip.status-ready { background: #ebf5fb; color: #1a5276; }
        .status-chip.status-delivered { background: #eafaf1; color: #1a7a4a; }
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #e74c3c;
            animation: pulseDot 1.2s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }

        .col-actions { text-align: right; }
        .row-actions { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
        .action-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface-alt);
            color: var(--text-muted);
            transition: all var(--transition);
            font-size: 15px;
            border: 1px solid transparent;
        }
        .action-btn:hover { background: var(--primary-light); color: var(--primary); }
        .action-btn.primary-action { background: var(--primary); color: #fff; }
        .action-btn.primary-action:hover { background: var(--primary-dark); }
        .action-btn.done { background: var(--surface-alt); color: #27ae60; cursor: default; }

        /* ---------- Empty / loading states ---------- */
        .empty-state, .loading-state {
            text-align: center;
            padding: 64px 24px;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 48px; color: var(--secondary); margin-bottom: 16px; display: block; }
        .empty-state h3 { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text-main); margin-bottom: 6px; }
        .loading-state .spinner {
            display: inline-block;
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 3px solid var(--border-light);
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
            margin-bottom: 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed; bottom: 32px; left: 50%;
            transform: translate(-50%, 80px);
            background: var(--surface);
            padding: 16px 28px;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-lg);
            display: flex; align-items: center; gap: 14px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            border: 1px solid var(--border-light);
            font-weight: 500; font-size: 14px;
            pointer-events: none;
            max-width: 90vw;
        }
        .toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
        .toast i { font-size: 22px; color: var(--secondary); }
        .toast.success i { color: #27ae60; }
        .toast.error i { color: #e74c3c; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            .main-content { padding: 24px 28px 48px; }
        }
        @media (max-width: 820px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.show { display: block; }
            .sidebar-toggle { display: flex; }
            .main-content { margin-left: 0; max-width: 100%; padding: 24px 20px 40px; padding-top: 76px; }
            .page-header { flex-direction: column; align-items: stretch; }
        }
        @media (max-width: 480px) {
            .stat-group { flex-direction: column; width: 100%; }
            .stat-card { display: flex; align-items: center; justify-content: space-between; width: 100%; }
            .page-header-left h2 { font-size: 26px; }
            .toast { bottom: 16px; padding: 14px 20px; font-size: 13px; width: calc(100% - 32px); justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Navigation principale">
        <div class="sidebar-brand">
            <img src="logo.jpg" alt="The Little Spoon" class="brand-logo" />
            <div>
                <h1>The Little <span>Spoon</span></h1>
                <div class="sub">Administration</div>
            </div>
        </div>

        <div class="nav-list">
            <a href="dashboard.html" class="nav-link active">
                <i class="ph-fill ph-gauge"></i>
                <span>Commandes</span>
            </a>
            <a href="produits.html" class="nav-link">
                <i class="ph-fill ph-cake"></i>
                <span>Produits</span>
            </a>
            <a href="categories.html" class="nav-link">
                <i class="ph-fill ph-tag"></i>
                <span>Catégories</span>
            </a>
        </div>

        <div class="sidebar-footer">
            <a href="produits.html?new=1" class="nav-link" style="color:var(--primary);">
                <i class="ph-fill ph-plus-circle"></i>
                <span>Nouveau produit</span>
            </a>
            <a href="#" class="nav-link logout" onclick="logout(); return false;">
                <i class="ph-fill ph-sign-out"></i>
                <span>Déconnexion</span>
            </a>
        </div>
    </nav>

    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Ouvrir le menu" aria-expanded="false">
        <i class="ph-bold ph-list"></i>
    </button>

    <main class="main-content" id="mainContent">

        <header class="page-header">
            <div class="page-header-left">
                <h2>Commandes</h2>
                <p><i class="ph ph-clock"></i> Gérez les douceurs du jour</p>
            </div>
            <div class="stat-group">
                <div class="stat-card today">
                    <div class="stat-label"><i class="ph ph-calendar-plus"></i> Aujourd'hui</div>
                    <div class="stat-value" id="statNewNumber">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label"><i class="ph ph-list-bullets"></i> Total</div>
                    <div class="stat-value" id="statTotalNumber">—</div>
                </div>
            </div>
        </header>

        <div class="filter-bar" id="filterBar" role="tablist" aria-label="Filtrer par statut">
            <button class="filter-pill active" data-status="all" role="tab" aria-selected="true">
                <i class="ph ph-circle"></i> Toutes <span class="badge-count" id="countAll">0</span>
            </button>
            <button class="filter-pill" data-status="nouvelle" role="tab" aria-selected="false">
                <i class="ph ph-bell"></i> Nouvelles <span class="badge-count" id="countNouvelle">0</span>
            </button>
            <button class="filter-pill" data-status="confirmée" role="tab" aria-selected="false">
                <i class="ph ph-check"></i> Confirmées <span class="badge-count" id="countConfirmée">0</span>
            </button>
            <button class="filter-pill" data-status="prête" role="tab" aria-selected="false">
                <i class="ph ph-package"></i> Prêtes <span class="badge-count" id="countPrête">0</span>
            </button>
            <button class="filter-pill" data-status="livrée" role="tab" aria-selected="false">
                <i class="ph ph-truck"></i> Livrées <span class="badge-count" id="countLivrée">0</span>
            </button>
        </div>

        <section id="ordersList" aria-label="Liste des commandes">
            <div class="loading-state">
                <div class="spinner" aria-hidden="true"></div>
                <p>Chargement des commandes…</p>
            </div>
        </section>

    </main>

    <div class="toast" id="toast" role="alert" aria-live="polite">
        <i class="ph ph-check-circle" aria-hidden="true"></i>
        <span id="toastText">Statut mis à jour</span>
    </div>

    <script src="js/auth-check.js"></script>

    <script>
        (function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const toggleBtn = document.getElementById('sidebarToggle');

            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('show');
                toggleBtn.setAttribute('aria-expanded', 'true');
                toggleBtn.innerHTML = '<i class="ph-bold ph-x"></i>';
                document.body.style.overflow = 'hidden';
            }
            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
                toggleBtn.setAttribute('aria-expanded', 'false');
                toggleBtn.innerHTML = '<i class="ph-bold ph-list"></i>';
                document.body.style.overflow = '';
            }
            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
            });
            overlay.addEventListener('click', closeSidebar);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
            });
            window.addEventListener('resize', function() {
                if (window.innerWidth > 820 && sidebar.classList.contains('open')) closeSidebar();
            });
        })();

        function showToast(message, type) {
            type = type || 'success';
            const toast = document.getElementById('toast');
            const text = document.getElementById('toastText');
            const icon = toast.querySelector('i');
            text.textContent = message;
            if (type === 'success') { icon.className = 'ph ph-check-circle'; toast.className = 'toast success'; }
            else if (type === 'error') { icon.className = 'ph ph-x-circle'; toast.className = 'toast error'; }
            else { icon.className = 'ph ph-info'; toast.className = 'toast'; }
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }
        window.showToast = showToast;

        function logout() {
            if (confirm('Voulez-vous vraiment vous déconnecter ?')) {
                localStorage.removeItem('authToken');
                sessionStorage.removeItem('authToken');
                window.location.href = 'login.html';
            }
        }
        window.logout = logout;
    </script>

    <script src="js/commandes.js"></script>

</body>
</html>
