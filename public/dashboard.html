<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Little Spoon — Admin</title>

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Google Fonts : Inter + Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
/* ============================================================
   THE LITTLE SPOON — Commandes / Dashboard
   Smooth UI v3 — same palette, same logic
   ============================================================ */

*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --primary: #7C4F5E;
    --primary-light: #F0E0E5;
    --primary-dark: #5C3A46;
    --secondary: #D4A373;
    --secondary-light: #F5E6D6;
    --accent-rose: #E8C4CD;
    --accent-sage: #C5D5C5;
    --bg-warm: #FCF8F5;
    --surface: #FFFFFF;
    --surface-alt: #F8F2EE;
    --text-main: #2D1B1B;
    --text-muted: #8A7A7A;
    --text-light: #B5A5A5;
    --border-light: #EDE5E0;

    --shadow-sm: 0 2px 12px rgba(124, 79, 94, 0.06);
    --shadow-md: 0 8px 32px rgba(124, 79, 94, 0.10);
    --shadow-lg: 0 16px 56px rgba(124, 79, 94, 0.14);

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 24px;
    --radius-xl: 32px;
    --radius-full: 999px;

    --transition: 0.24s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    --transition-bounce: 0.34s cubic-bezier(0.34, 1.28, 0.64, 1);
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg-warm);
    color: var(--text-main);
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
        radial-gradient(ellipse at 20% 50%, rgba(212, 163, 115, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(124, 79, 94, 0.04) 0%, transparent 50%);
}

a {
    color: inherit;
    text-decoration: none;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
    border: 0;
    background: none;
    font-size: inherit;
}

button:focus-visible,
a:focus-visible {
    outline: 3px solid rgba(212, 163, 115, 0.35);
    outline-offset: 3px;
}

/* ---------- Scrollbar ---------- */

::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track {
    background: var(--border-light);
    border-radius: var(--radius-full);
}

::-webkit-scrollbar-thumb {
    background: var(--secondary);
    border-radius: var(--radius-full);
}

::-webkit-scrollbar-thumb:hover {
    background: var(--primary);
}

/* ============================================================
   APP SHELL
   ============================================================ */

.app-shell {
    display: flex;
    min-height: 100vh;
}

/* ============================================================
   SIDEBAR — aligned with Categories page
   ============================================================ */

.sidebar {
    width: 270px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border-light);
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 100;
    transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: var(--shadow-sm);
    overflow-y: auto;
}

.sidebar-brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border-light);
    flex-shrink: 0;
}

.sidebar-brand .brand-logo {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(120, 84, 96, 0.15);
    border: 2px solid var(--accent-rose);
}

.sidebar-brand h1 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: -0.02em;
    line-height: 1.2;
}

.sidebar-brand h1 span {
    font-weight: 400;
    color: var(--text-muted);
    font-size: 16px;
}

.sidebar-brand .sub {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-light);
    font-weight: 600;
    margin-top: 2px;
}

.nav-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 0;
}

.nav-link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    font-weight: 500;
    font-size: 14px;
    color: var(--text-muted);
    transition: all var(--transition);
    position: relative;
}

.nav-link i {
    width: 22px;
    font-size: 18px;
    text-align: center;
    flex-shrink: 0;
    transition: transform var(--transition-bounce), color var(--transition);
}

.nav-link:hover {
    background: var(--surface-alt);
    color: var(--text-main);
}

.nav-link:hover i {
    transform: translateX(2px) scale(1.08);
    color: var(--primary);
}

.nav-link.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 600;
}

.nav-link.active i {
    color: var(--primary);
}

.nav-link.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 0 4px 4px 0;
    background: var(--primary);
}

.sidebar-footer {
    padding-top: 16px;
    border-top: 1px solid var(--border-light);
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
}

.sidebar-footer .nav-link {
    font-size: 13px;
}

.sidebar-footer .nav-link.logout:hover {
    color: #c0392b;
    background: rgba(192, 57, 43, 0.06);
}

.sidebar-footer .nav-link.logout i {
    font-size: 16px;
}

/* ---------- Mobile sidebar ---------- */

.sidebar-toggle {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 200;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--surface);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-light);
    color: var(--primary);
    font-size: 20px;
    transition: transform var(--transition), box-shadow var(--transition);
}

.sidebar-toggle:hover {
    transform: scale(1.04);
    box-shadow: var(--shadow-lg);
}

.sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(45, 27, 27, 0.3);
    z-index: 90;
    backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.sidebar-overlay.show {
    opacity: 1;
}

/* ============================================================
   MAIN
   ============================================================ */

.main-content {
    flex: 1;
    margin-left: 270px;
    padding: 32px 44px 60px;
    width: calc(100% - 270px);
    max-width: 1600px;
    transition: margin 0.35s ease, width 0.35s ease;
}

/* ---------- Header ---------- */

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    margin-bottom: 26px;
}

.page-header-left {
    min-width: 0;
}

.page-header-left h2 {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: -0.02em;
    line-height: 1.2;
}

.page-header-left p {
    color: var(--text-muted);
    font-size: 15px;
    margin-top: 6px;
}

.page-header-left p i {
    color: var(--secondary);
}

/* ============================================================
   STATS — compact dashboard cards
   ============================================================ */

.stat-group {
    display: grid;
    grid-template-columns: repeat(2, minmax(150px, 1fr));
    gap: 12px;
    width: min(360px, 100%);
}

.stat-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: 14px 18px;
    min-width: 0;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition:
        transform var(--transition-bounce),
        box-shadow var(--transition),
        border-color var(--transition);
}

.stat-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--accent-rose);
    opacity: 0;
    transition: opacity var(--transition);
}

.stat-card.today::before {
    opacity: 1;
    background: var(--secondary);
}

.stat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--accent-rose);
}

.stat-label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-light);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.stat-label i {
    color: var(--secondary);
}

.stat-value {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 5px;
    color: var(--primary);
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
}

.stat-card.today .stat-value {
    color: var(--secondary);
}

.stat-icon {
    width: 30px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 14px;
}

.stat-card.today .stat-icon {
    background: var(--secondary-light);
    color: var(--secondary);
}

/* ============================================================
   COMMANDS / FILTERS
   Grid instead of oversized pills
   ============================================================ */

.filter-bar {
    display: grid;
    grid-template-columns: repeat(5, minmax(115px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
}

.filter-pill {
    min-height: 52px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
    transition:
        transform var(--transition-bounce),
        background var(--transition),
        color var(--transition),
        border-color var(--transition),
        box-shadow var(--transition);
    white-space: nowrap;
}

.filter-pill i {
    width: 18px;
    text-align: center;
    color: var(--secondary);
    font-size: 14px;
    transition: transform var(--transition-bounce), color var(--transition);
}

.filter-pill:hover {
    transform: translateY(-2px);
    border-color: var(--accent-rose);
    color: var(--text-main);
    box-shadow: var(--shadow-sm);
}

.filter-pill:hover i {
    transform: scale(1.12);
    color: var(--primary);
}

.filter-pill.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 5px 16px rgba(124, 79, 94, 0.20);
}

.filter-pill.active i {
    color: #fff;
}

.badge-count {
    min-width: 24px;
    height: 22px;
    padding: 0 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-full);
    background: var(--surface-alt);
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 800;
}

.filter-pill.active .badge-count {
    background: rgba(255, 255, 255, 0.20);
    color: #fff;
}

/* ============================================================
   ORDERS
   ============================================================ */

.orders-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.order-card {
    position: relative;
    display: grid;
    grid-template-columns: minmax(260px, 1fr) auto auto;
    align-items: center;
    gap: 18px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition:
        transform var(--transition-bounce),
        box-shadow var(--transition),
        border-color var(--transition);
    animation: cardIn 0.32s ease both;
}

.order-card:nth-child(2) { animation-delay: .03s; }
.order-card:nth-child(3) { animation-delay: .06s; }
.order-card:nth-child(4) { animation-delay: .09s; }
.order-card:nth-child(5) { animation-delay: .12s; }

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(7px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.order-card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--border-light);
}

.order-card.status-new::before { background: #e74c3c; }
.order-card.status-confirmed::before { background: #f39c12; }
.order-card.status-ready::before { background: #3498db; }
.order-card.status-delivered::before { background: #27ae60; }

.order-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--accent-rose);
}

/* ---------- Order identity ---------- */

.order-left {
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
}

.order-thumb {
    width: 48px;
    height: 48px;
    flex: 0 0 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    background: var(--primary-light);
    color: var(--primary);
    font-size: 20px;
    transition: transform var(--transition-bounce), background var(--transition);
}

.order-card:hover .order-thumb {
    transform: scale(1.05);
    background: var(--accent-rose);
}

.order-info {
    min-width: 0;
}

.order-name {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-main);
}

.order-id {
    padding: 3px 8px;
    border-radius: var(--radius-full);
    background: var(--surface-alt);
    color: var(--text-light);
    font-family: 'Inter', monospace;
    font-size: 10px;
    font-weight: 500;
}

.order-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 4px;
    color: var(--text-muted);
    font-size: 11px;
}

.order-meta span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.order-meta i {
    color: var(--secondary);
    font-size: 11px;
}

/* ============================================================
   STATUS
   ============================================================ */

.status-chip {
    min-width: 112px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: var(--radius-full);
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
}

.status-chip i {
    font-size: 10px;
}

.status-chip.new {
    background: #fde8e8;
    color: #c0392b;
}

.status-chip.new i {
    color: #e74c3c;
    animation: pulseDot 1.3s infinite;
}

.status-chip.confirmed {
    background: #fef5e7;
    color: #b7950b;
}

.status-chip.confirmed i {
    color: #f39c12;
}

.status-chip.ready {
    background: #ebf5fb;
    color: #1a5276;
}

.status-chip.ready i {
    color: #3498db;
}

.status-chip.delivered {
    background: #eafaf1;
    color: #1a7a4a;
}

.status-chip.delivered i {
    color: #27ae60;
}

@keyframes pulseDot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: .65; }
}

/* ============================================================
   ACTION COMMANDS
   Keeps existing .action-btn logic/classes
   ============================================================ */

.order-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    flex-wrap: wrap;
}

.action-btn {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    background: var(--surface-alt);
    color: var(--text-muted);
    border: 1px solid transparent;
    font-size: 14px;
    transition:
        transform var(--transition-bounce),
        background var(--transition),
        color var(--transition),
        border-color var(--transition),
        box-shadow var(--transition);
}

.action-btn:hover {
    transform: translateY(-2px);
    background: var(--primary-light);
    color: var(--primary);
    border-color: var(--accent-rose);
    box-shadow: 0 4px 12px rgba(124, 79, 94, 0.12);
}

.action-btn:active {
    transform: scale(.94);
}

.action-btn.primary-action {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    box-shadow: 0 4px 12px rgba(124, 79, 94, 0.18);
}

.action-btn.primary-action:hover {
    background: var(--primary-dark);
    color: #fff;
    box-shadow: 0 6px 16px rgba(124, 79, 94, 0.24);
}

.action-btn.danger:hover {
    background: #fde8e8;
    color: #c0392b;
    border-color: #f5c6c6;
}

/* ============================================================
   EMPTY / LOADING
   ============================================================ */

.empty-state {
    text-align: center;
    padding: 58px 24px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px dashed var(--border-light);
    border-radius: var(--radius-md);
}

.empty-state i {
    display: block;
    margin-bottom: 14px;
    color: var(--border-light);
    font-size: 44px;
}

.empty-state h3 {
    margin-bottom: 6px;
    color: var(--text-main);
    font-family: 'Playfair Display', serif;
    font-size: 21px;
}

.empty-state p {
    max-width: 420px;
    margin: 0 auto;
    font-size: 14px;
}

.loading-state {
    text-align: center;
    padding: 52px 20px;
    color: var(--text-muted);
}

.loading-state .spinner {
    display: inline-block;
    width: 34px;
    height: 34px;
    margin-bottom: 12px;
    border: 3px solid var(--border-light);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .75s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ============================================================
   TOAST
   ============================================================ */

.toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: min(520px, calc(100vw - 32px));
    padding: 13px 20px;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-full);
    background: var(--surface);
    box-shadow: var(--shadow-lg);
    color: var(--text-main);
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 60px);
    transition: transform .35s var(--transition-bounce), opacity .25s ease;
}

.toast.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
}

.toast i {
    color: var(--secondary);
    font-size: 18px;
}

.toast.success i { color: #27ae60; }
.toast.error i { color: #e74c3c; }

/* ============================================================
   ANIMATION HELPERS
   ============================================================ */

.fade-in {
    animation: fadeUp .35s ease both;
}

.fade-in-d1 { animation-delay: .04s; }
.fade-in-d2 { animation-delay: .08s; }

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(6px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (max-width: 1200px) {
    .main-content {
        padding-left: 30px;
        padding-right: 30px;
    }

    .filter-bar {
        grid-template-columns: repeat(3, minmax(130px, 1fr));
    }

    .order-card {
        grid-template-columns: minmax(220px, 1fr) auto;
    }

    .status-chip {
        justify-self: end;
    }
}

@media (max-width: 900px) {
    .page-header {
        align-items: stretch;
        flex-direction: column;
    }

    .stat-group {
        width: 100%;
        max-width: 430px;
    }

    .order-card {
        grid-template-columns: 1fr auto;
    }

    .order-actions {
        grid-column: 1 / -1;
        justify-content: flex-end;
        padding-top: 8px;
        border-top: 1px solid var(--border-light);
    }
}

@media (max-width: 820px) {
    .sidebar {
        transform: translateX(-100%);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .sidebar-overlay.show {
        display: block;
    }

    .sidebar-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .main-content {
        margin-left: 0;
        width: 100%;
        max-width: none;
        padding: 76px 20px 40px;
    }

    .filter-bar {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 560px) {
    .main-content {
        padding: 72px 14px 32px;
    }

    .page-header-left h2 {
        font-size: 28px;
    }

    .stat-group {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .stat-card {
        padding: 12px 13px;
    }

    .stat-value {
        font-size: 24px;
    }

    .filter-bar {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .filter-pill {
        min-height: 48px;
        padding: 7px 8px;
        font-size: 11px;
    }

    .order-card {
        grid-template-columns: 1fr;
        padding: 13px 14px;
    }

    .status-chip {
        justify-self: start;
        min-width: auto;
    }

    .order-actions {
        grid-column: auto;
        justify-content: flex-start;
    }

    .sidebar {
        width: 260px;
        padding: 20px 14px;
    }

    .sidebar-brand .brand-logo {
        width: 40px;
        height: 40px;
    }

    .sidebar-brand h1 {
        font-size: 17px;
    }

    .toast {
        bottom: 16px;
        width: calc(100% - 28px);
        justify-content: center;
    }
}

@media (max-width: 380px) {
    .filter-bar {
        grid-template-columns: 1fr;
    }

    .stat-group {
        grid-template-columns: 1fr;
    }

    .stat-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .stat-value {
        margin-top: 0;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>
<body>

    <!-- ============================================================
    SIDEBAR OVERLAY (mobile)
    ============================================================ -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ============================================================
    SIDEBAR
    ============================================================ -->
    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Navigation principale">
        <div class="sidebar-brand">
            <img
            src="logo.jpg"
            alt="The Little Spoon logo"
            class="brand-logo"
            />
            <div>
                <h1>The Little <span>Spoon</span></h1>
                <div class="sub">Administration</div>
            </div>
        </div>

        <div class="nav-list">
            <a href="dashboard.html" class="nav-link active">
                <i class="fa-solid fa-gauge-high"></i>
                <span>Commandes</span>
            </a>
            <a href="produits.html" class="nav-link">
                <i class="fa-solid fa-cake-slice"></i>
                <span>Produits</span>
            </a>
            <a href="categories.html" class="nav-link">
                <i class="fa-solid fa-tags"></i>
                <span>Catégories</span>
            </a>
        </div>

        <div class="sidebar-footer">
            <a href="produits.html?new=1" class="nav-link" style="color:var(--primary);">
                <i class="fa-solid fa-plus-circle"></i>
                <span>Nouveau produit</span>
            </a>
            <a href="#" class="nav-link logout" onclick="logout(); return false;">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Déconnexion</span>
            </a>
        </div>
    </nav>

    <!-- ============================================================
    MOBILE TOGGLE
    ============================================================ -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Ouvrir le menu" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <main class="main-content" id="mainContent">

        <!-- Header -->
        <header class="page-header">
            <div class="page-header-left">
                <h2>Commandes</h2>
                <p><i class="fa-solid fa-clock" style="margin-right:6px;opacity:0.6;"></i>Gérez les douceurs du jour</p>
            </div>
            <div class="stat-group">
                <div class="stat-card today fade-in fade-in-d1">
                    <div class="stat-label">
                        <i class="fa-solid fa-calendar-day" style="margin-right:4px;"></i> Aujourd'hui
                    </div>
                    <div class="stat-value" id="statNew">
                        <span class="stat-icon" aria-hidden="true"><i class="fa-solid fa-clock"></i></span>
                        <span id="statNewNumber">—</span>
                    </div>
                </div>
                <div class="stat-card fade-in fade-in-d2">
                    <div class="stat-label">
                        <i class="fa-solid fa-list-check" style="margin-right:4px;"></i> Total
                    </div>
                    <div class="stat-value" id="statTotal">
                        <span class="stat-icon" aria-hidden="true"><i class="fa-solid fa-list-check"></i></span>
                        <span id="statTotalNumber">—</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Filters -->
        <div class="filter-bar" id="filterBar" role="tablist" aria-label="Filtrer par statut">
            <button class="filter-pill active" data-status="all" role="tab" aria-selected="true">
                <i class="fa-solid fa-layer-group"></i> Toutes
                <span class="badge-count" id="countAll">0</span>
            </button>
            <button class="filter-pill" data-status="nouvelle" role="tab" aria-selected="false">
                <i class="fa-solid fa-layer-group-exclamation"></i> Nouvelles
                <span class="badge-count" id="countNouvelle">0</span>
            </button>
            <button class="filter-pill" data-status="confirmée" role="tab" aria-selected="false">
                <i class="fa-solid fa-layer-group-check"></i> Confirmées
                <span class="badge-count" id="countConfirmée">0</span>
            </button>
            <button class="filter-pill" data-status="prête" role="tab" aria-selected="false">
                <i class="fa-solid fa-layer-group-check"></i> Prêtes
                <span class="badge-count" id="countPrête">0</span>
            </button>
            <button class="filter-pill" data-status="livrée" role="tab" aria-selected="false">
                <i class="fa-solid fa-layer-group-check"></i> Livrées
                <span class="badge-count" id="countLivrée">0</span>
            </button>
        </div>

        <!-- Orders list -->
        <section id="ordersList" class="orders-container" aria-label="Liste des commandes">
            <div class="loading-state">
                <div class="spinner" aria-hidden="true"></div>
                <p>Chargement des commandes…</p>
            </div>
        </section>

    </main>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div class="toast" id="toast" role="alert" aria-live="polite">
        <i class="fa-solid fa-layer-group-check" aria-hidden="true"></i>
        <span id="toastText">Statut mis à jour</span>
    </div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="js/auth-check.js"></script>
    <script src="js/commandes.js"></script>

    <script>
        // ============================================================
        // SIDEBAR TOGGLE (mobile)
        // ============================================================
        (function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const toggleBtn = document.getElementById('sidebarToggle');

            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('show');
                toggleBtn.setAttribute('aria-expanded', 'true');
                toggleBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
                toggleBtn.setAttribute('aria-expanded', 'false');
                toggleBtn.innerHTML = '<i class="fa-solid fa-bars"></i>';
                document.body.style.overflow = '';
            }

            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (sidebar.classList.contains('open')) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            });

            overlay.addEventListener('click', closeSidebar);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && sidebar.classList.contains('open')) {
                    closeSidebar();
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 820 && sidebar.classList.contains('open')) {
                    closeSidebar();
                }
            });

            document.querySelectorAll('.nav-link').forEach(function(link) {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 820) {
                        closeSidebar();
                    }
                });
            });
        })();

        // ============================================================
        // FILTER PILLS — sync with commandes.js
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const pills = document.querySelectorAll('.filter-pill');

            document.addEventListener('ordersUpdated', function(e) {
                const counts = e.detail.counts || {};
                document.getElementById('countAll').textContent = counts.all || 0;
                document.getElementById('countNouvelle').textContent = counts.nouvelle || 0;
                document.getElementById('countConfirmée').textContent = counts.confirmée || 0;
                document.getElementById('countPrête').textContent = counts.prête || 0;
                document.getElementById('countLivrée').textContent = counts.livrée || 0;
            });

            document.addEventListener('statsUpdated', function(e) {
                const stats = e.detail || {};
                document.getElementById('statNewNumber').textContent = stats.newToday !== undefined ? stats.newToday :
                '—';
                document.getElementById('statTotalNumber').textContent = stats.total !== undefined ? stats.total : '—';
            });
        });

        // ============================================================
        // TOAST helper (used by commandes.js)
        // ============================================================
        function showToast(message, type) {
            type = type || 'success';
            const toast = document.getElementById('toast');
            const text = document.getElementById('toastText');
            const icon = toast.querySelector('i');

            text.textContent = message;

            if (type === 'success') {
                icon.className = 'fa-solid fa-layer-group-check';
                toast.className = 'toast success';
            } else if (type === 'error') {
                icon.className = 'fa-solid fa-layer-group-xmark';
                toast.className = 'toast error';
            } else {
                icon.className = 'fa-solid fa-layer-group-info';
                toast.className = 'toast';
            }

            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(function() {
                toast.classList.remove('show');
            }, 3000);
        }

        window.showToast = showToast;

        // ============================================================
        // LOGOUT
        // ============================================================
        function logout() {
            if (confirm('Voulez-vous vraiment vous déconnecter ?')) {
                localStorage.removeItem('authToken');
                sessionStorage.removeItem('authToken');
                window.location.href = 'login.html';
            }
        }
        window.logout = logout;
    </script>

</body>
</html>
