<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Little Spoon — Admin</title>

    <!-- Phosphor Icons (same as categories.html) -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

    <!-- Google Fonts : Inter + Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           THE LITTLE SPOON — Dashboard (Phosphor icons, responsive card layout)
           ============================================================ */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #785460;
            --primary-container: #F4C6D4;
            --primary-dark: #E8A6BC;
            --primary-light: #F0E0E5;
            --secondary: #C9A97E;
            --secondary-light: #F5E6D6;
            --accent-rose: #E8C4CD;
            --accent-sage: #C5D5C5;
            --bg-warm: #FFF8F5;
            --surface: #FFFFFF;
            --surface-alt: #F8F2EE;
            --text-main: #3A2E2E;
            --text-muted: #8B7B7B;
            --text-light: #B5A5A5;
            --border-light: #EDE5E0;
            --shadow-sm: 0 2px 12px rgba(120, 84, 96, 0.06);
            --shadow-md: 0 8px 32px rgba(120, 84, 96, 0.10);
            --shadow-lg: 0 16px 56px rgba(120, 84, 96, 0.14);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 999px;
            --transition: 0.30s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-bounce: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-warm);
            color: var(--text-main);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(201, 169, 126, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(120, 84, 96, 0.04) 0%, transparent 50%);
            animation: pageFade 0.7s ease forwards;
        }

        @keyframes pageFade {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; font-size: inherit; }
        input, select, textarea { font-family: inherit; font-size: 16px; }

        /* ---------- Scrollbar ---------- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--border-light); border-radius: var(--radius-full); }
        ::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: var(--radius-full); }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* ============================================================
           SIDEBAR (exactly like categories.html)
           ============================================================ */
        .sidebar {
            width: 270px;
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border-light);
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: var(--shadow-sm);
            overflow-y: auto;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }

        .sidebar-brand .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(120, 84, 96, 0.15);
            border: 2px solid var(--accent-rose);
        }

        .sidebar-brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .sidebar-brand h1 span {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 16px;
        }
        .sidebar-brand .sub {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-light);
            font-weight: 600;
            margin-top: 2px;
        }

        .nav-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px 0;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 14px;
            color: var(--text-muted);
            transition: all var(--transition);
            position: relative;
        }
        .nav-link i {
            width: 34px;
            height: 34px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--surface-alt);
            flex-shrink: 0;
            transition: all var(--transition);
        }
        .nav-link:hover {
            background: var(--surface-alt);
            color: var(--text-main);
        }
        .nav-link:hover i {
            background: var(--primary-light);
        }
        .nav-link.active {
            background: var(--primary-container);
            color: var(--primary);
            font-weight: 600;
        }
        .nav-link.active i {
            background: var(--surface);
            color: var(--primary);
        }
        .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 3px;
            border-radius: 0 4px 4px 0;
            background: var(--primary);
        }

        .sidebar-footer {
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .sidebar-footer .nav-link {
            font-size: 13px;
        }
        .sidebar-footer .nav-link.logout {
            color: var(--text-muted);
        }
        .sidebar-footer .nav-link.logout:hover {
            color: #c0392b;
            background: rgba(192, 57, 43, 0.06);
        }
        .sidebar-footer .nav-link.logout i {
            font-size: 16px;
        }

        /* ---------- Mobile toggle ---------- */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 200;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--surface);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
            color: var(--primary);
            font-size: 20px;
            transition: all var(--transition);
        }
        .sidebar-toggle:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-lg);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(45, 27, 27, 0.3);
            z-index: 90;
            backdrop-filter: blur(3px);
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .sidebar-overlay.show {
            opacity: 1;
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            flex: 1;
            margin-left: 270px;
            padding: 32px 44px 60px;
            max-width: 1280px;
            width: 100%;
            transition: margin 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow-x: hidden;
        }

        /* ---------- Header ---------- */
        .page-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-end;
            gap: 24px;
            margin-bottom: 28px;
        }

        .page-header-left h2 {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .page-header-left p {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 400;
            margin-top: 4px;
        }
        .page-header-left p i {
            animation: spinSlow 6s linear infinite;
        }
        @keyframes spinSlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stat-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 16px 22px;
            min-width: 140px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            transition: all var(--transition-bounce);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(201, 169, 126, 0.04), transparent 70%);
            transition: opacity 0.6s;
            opacity: 0;
        }
        .stat-card:hover::after {
            opacity: 1;
        }
        .stat-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: var(--shadow-md);
            border-color: var(--accent-rose);
        }

        .stat-card .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-light);
            font-weight: 600;
        }
        .stat-card .stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 4px;
            line-height: 1.2;
            transition: all var(--transition);
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { text-shadow: 0 0 0 rgba(120, 84, 96, 0); }
            100% { text-shadow: 0 0 12px rgba(120, 84, 96, 0.15); }
        }
        .stat-card .stat-value .stat-icon {
            font-size: 20px;
            color: var(--secondary);
            margin-right: 6px;
            opacity: 0.7;
        }
        .stat-card.today .stat-value {
            color: var(--secondary);
        }
        .stat-card.today .stat-value .stat-icon {
            color: var(--secondary);
        }

        /* ---------- Filter pills (Phosphor) ---------- */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
            padding-bottom: 4px;
        }

        .filter-pill {
            padding: 10px 24px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 13px;
            background: var(--surface);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            transition: all var(--transition-bounce);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        .filter-pill i {
            font-size: 16px;
            opacity: 0.6;
            transition: transform var(--transition);
        }
        .filter-pill:hover {
            border-color: var(--secondary);
            color: var(--text-main);
            transform: translateY(-2px);
        }
        .filter-pill:hover i {
            transform: rotate(8deg) scale(1.1);
        }
        .filter-pill.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(120, 84, 96, 0.25);
        }
        .filter-pill.active i {
            opacity: 1;
            color: #fff;
            transform: scale(1.1);
        }
        .filter-pill .badge-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 0 10px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 700;
        }
        .filter-pill.active .badge-count {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ---------- View toggle ---------- */
        .view-toggle {
            display: flex;
            gap: 6px;
            background: var(--surface-alt);
            padding: 4px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-light);
            margin-bottom: 24px;
            flex-shrink: 0;
            width: fit-content;
        }
        .view-toggle button {
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .view-toggle button i {
            font-size: 18px;
        }
        .view-toggle button.active {
            background: var(--surface);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        .view-toggle button:hover:not(.active) {
            color: var(--text-main);
        }

        /* ---------- Orders container ---------- */
        .orders-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 18px;
            animation: fadeUp 0.5s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Order card ---------- */
        .order-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 18px 24px;
            transition: all var(--transition-bounce);
            position: relative;
            overflow: hidden;
            animation: cardSlide 0.4s ease forwards;
            opacity: 0;
        }
        .order-card:nth-child(1) { animation-delay: 0.05s; }
        .order-card:nth-child(2) { animation-delay: 0.10s; }
        .order-card:nth-child(3) { animation-delay: 0.15s; }
        .order-card:nth-child(4) { animation-delay: 0.20s; }
        .order-card:nth-child(5) { animation-delay: 0.25s; }

        @keyframes cardSlide {
            0% { opacity: 0; transform: translateX(-10px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .order-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 4px;
            border-radius: 0 4px 4px 0;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .order-card.status-new::before { background: #e74c3c; opacity: 1; }
        .order-card.status-confirmed::before { background: #f39c12; opacity: 1; }
        .order-card.status-ready::before { background: #3498db; opacity: 1; }
        .order-card.status-delivered::before { background: #27ae60; opacity: 1; }

        .order-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: var(--shadow-md);
            border-color: var(--accent-rose);
        }

        .order-card .order-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1 1 200px;
            min-width: 0;
        }

        .order-card .order-thumb {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-sm);
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--primary);
            flex-shrink: 0;
            transition: all var(--transition-bounce);
        }
        .order-card:hover .order-thumb {
            transform: scale(1.08) rotate(-4deg);
            background: var(--accent-rose);
        }

        .order-card .order-info {
            min-width: 0;
        }
        .order-card .order-info .order-name {
            font-weight: 600;
            font-size: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .order-card .order-info .order-name .order-id {
            font-weight: 400;
            font-size: 12px;
            color: var(--text-light);
            font-family: 'Inter', monospace;
            background: var(--surface-alt);
            padding: 2px 10px;
            border-radius: var(--radius-full);
        }
        .order-card .order-info .order-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 3px;
        }
        .order-card .order-info .order-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .order-card .order-info .order-meta i {
            font-size: 13px;
            opacity: 0.6;
            transition: all var(--transition);
        }
        .order-card:hover .order-info .order-meta i {
            opacity: 1;
            color: var(--primary);
        }

        /* Status chip */
        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 16px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
            transition: all var(--transition);
        }
        .status-chip i {
            font-size: 12px;
            animation: none;
        }
        .status-chip.new {
            background: #fde8e8;
            color: #c0392b;
        }
        .status-chip.new i {
            color: #e74c3c;
            animation: pulseDot 1.2s infinite;
        }
        .status-chip.confirmed {
            background: #fef5e7;
            color: #b7950b;
        }
        .status-chip.confirmed i {
            color: #f39c12;
        }
        .status-chip.ready {
            background: #ebf5fb;
            color: #1a5276;
        }
        .status-chip.ready i {
            color: #3498db;
        }
        .status-chip.delivered {
            background: #eafaf1;
            color: #1a7a4a;
        }
        .status-chip.delivered i {
            color: #27ae60;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
        }

        /* Order actions */
        .order-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-left: auto;
            width: 100%;
            padding-top: 4px;
            border-top: 1px solid var(--border-light);
        }

        .action-btn {
            min-height: 40px;
            padding: 0 14px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            background: var(--surface-alt);
            color: var(--text-muted);
            border: 1px solid var(--border-light);
            transition: all var(--transition);
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }
        .action-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
            transform: scale(1.12) rotate(6deg);
            border-color: var(--accent-rose);
            box-shadow: 0 4px 12px rgba(120, 84, 96, 0.15);
        }
        
            100% { transform: rotate(180deg); }
        }
        .action-btn:active {
            transform: scale(0.92);
        }
        .action-btn.primary-action {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 14px rgba(120, 84, 96, 0.25);
        }
        .action-btn.primary-action:hover {
            background: var(--primary-dark);
            box-shadow: 0 6px 20px rgba(120, 84, 96, 0.35);
            transform: scale(1.12);
        }
        .action-btn.primary-action:active {
            transform: scale(0.92);
        }
        .action-btn.danger:hover {
            background: #fde8e8;
            color: #c0392b;
            border-color: #f5c6c6;
        }

        /* ---------- Empty / loading states ---------- */
        .empty-state {
            text-align: center;
            padding: 72px 32px;
            color: var(--text-muted);
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px dashed var(--border-light);
        }
        .empty-state i {
            font-size: 56px;
            color: var(--border-light);
            margin-bottom: 20px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        .empty-state h3 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 15px;
            max-width: 400px;
            margin: 0 auto;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .loading-state .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid var(--border-light);
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translate(-50%, 80px);
            background: var(--surface);
            padding: 16px 28px;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 14px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            border: 1px solid var(--border-light);
            font-weight: 500;
            font-size: 14px;
            pointer-events: none;
            max-width: 90vw;
        }
        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
            pointer-events: auto;
        }
        .toast i {
            font-size: 22px;
            color: var(--secondary);
        }
        .toast.success i {
            color: #27ae60;
        }
        .toast.error i {
            color: #e74c3c;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            .main-content { padding: 24px 28px 48px; }
            .stat-card { min-width: 120px; padding: 14px 18px; }
            .stat-card .stat-value { font-size: 26px; }
        }

        @media (max-width: 820px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay.show {
                display: block;
            }
            .sidebar-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .main-content {
                margin-left: 0;
                padding: 24px 20px 40px;
                padding-top: 76px;
            }
            .page-header {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            .stat-group {
                justify-content: flex-start;
            }
            .order-card {
                padding: 16px 18px;
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
            }
            .order-card .order-left {
                flex: 1 1 auto;
            }
            .order-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-left: auto;
            width: 100%;
            padding-top: 4px;
            border-top: 1px solid var(--border-light);
        }
            .order-card .order-info .order-name {
                font-size: 15px;
            }
            .filter-pill {
                padding: 8px 16px;
                font-size: 12px;
            }
            .orders-container { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .stat-group {
                flex-direction: column;
                width: 100%;
            }
            .stat-card {
                min-width: unset;
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 18px;
            }
            .stat-card .stat-value {
                font-size: 24px;
                margin-top: 0;
            }
            .stat-card .stat-label {
                font-size: 12px;
            }
            .page-header-left h2 {
                font-size: 28px;
            }
            .order-card .order-thumb {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
            .toast {
                bottom: 16px;
                padding: 14px 20px;
                font-size: 13px;
                width: calc(100% - 32px);
                justify-content: center;
            }
        }

        /* ---------- Utilities ---------- */
        .fade-in { animation: fadeUp 0.4s ease forwards; }
        .fade-in-d1 { animation-delay: 0.05s; }
        .fade-in-d2 { animation-delay: 0.10s; }
        .fade-in-d3 { animation-delay: 0.15s; }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

    <!-- ============================================================

        <i class="ph-bold ph-list"></i>
    </button>

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <main class="main-content" id="mainContent">

        <!-- Header -->
        <header class="page-header">

            </div>
            <div class="stat-group">
                <div class="stat-card today fade-in fade-in-d1">

                    </div>
                    <div class="stat-value" id="statNew">

                        <span id="statNewNumber">—</span>
                    </div>
                </div>
                <div class="stat-card fade-in fade-in-d2">
                    <div class="stat-label">
                        <i class="ph ph-list" style="margin-right:4px;"></i> Total
                    </div>
                    <div class="stat-value" id="statTotal">

                        <span id="statTotalNumber">—</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Filters -->
        <div class="filter-bar" id="filterBar" role="tablist" aria-label="Filtrer par statut">
            <button class="filter-pill active" data-status="all" role="tab" aria-selected="true">
                <i class="ph ph-circle"></i> Toutes
                <span class="badge-count" id="countAll">0</span>
            </button>
            <button class="filter-pill" data-status="nouvelle" role="tab" aria-selected="false">
                <i class="ph ph-circle-wavy-warning"></i> Nouvelles
                <span class="badge-count" id="countNouvelle">0</span>
            </button>
            <button class="filter-pill" data-status="confirmée" role="tab" aria-selected="false">
                <i class="ph ph-check-circle"></i> Confirmées
                <span class="badge-count" id="countConfirmée">0</span>
            </button>
            <button class="filter-pill" data-status="prête" role="tab" aria-selected="false">
                <i class="ph ph-check-circle"></i> Prêtes
                <span class="badge-count" id="countPrête">0</span>
            </button>
            <button class="filter-pill" data-status="livrée" role="tab" aria-selected="false">
                <i class="ph ph-check-circle"></i> Livrées
                <span class="badge-count" id="countLivrée">0</span>

        <section id="ordersList" class="orders-container" aria-label="Liste des commandes">

            </div>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div class="toast" id="toast" role="alert" aria-live="polite">
        <i class="ph ph-check-circle" aria-hidden="true"></i>
        <span id="toastText">Statut mis à jour</span>
    </div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="js/auth-check.js"></script>
    <script src="js/commandes.js"></script>

    <script>
        // ============================================================
        // SIDEBAR TOGGLE (mobile) — unchanged
        // ============================================================
        (function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const toggleBtn = document.getElementById('sidebarToggle');

            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('show');
                toggleBtn.setAttribute('aria-expanded', 'true');
                toggleBtn.innerHTML = '<i class="ph-bold ph-x"></i>';
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
                toggleBtn.setAttribute('aria-expanded', 'false');
                toggleBtn.innerHTML = '<i class="ph-bold ph-list"></i>';
                document.body.style.overflow = '';
            }

            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (sidebar.classList.contains('open')) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            });

            overlay.addEventListener('click', closeSidebar);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && sidebar.classList.contains('open')) {
                    closeSidebar();
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 820 && sidebar.classList.contains('open')) {
                    closeSidebar();
                }
            });

            document.querySelectorAll('.nav-link').forEach(function(link) {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 820) {
                        closeSidebar();
                    }
                });
            });
        })();

        // ============================================================
        // FILTER PILLS — sync with commandes.js (original event listeners)
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const pills = document.querySelectorAll('.filter-pill');

            document.addEventListener('ordersUpdated', function(e) {
                const counts = e.detail.counts || {};
                document.getElementById('countAll').textContent = counts.all || 0;
                document.getElementById('countNouvelle').textContent = counts.nouvelle || 0;
                document.getElementById('countConfirmée').textContent = counts.confirmée || 0;
                document.getElementById('countPrête').textContent = counts.prête || 0;
                document.getElementById('countLivrée').textContent = counts.livrée || 0;
            });

            document.addEventListener('statsUpdated', function(e) {
                const stats = e.detail || {};
                document.getElementById('statNewNumber').textContent = stats.newToday !== undefined ? stats.newToday : '—';
                document.getElementById('statTotalNumber').textContent = stats.total !== undefined ? stats.total : '—';
            });
        });

        // ============================================================
        // TOAST helper (used by commandes.js) — unchanged
        // ============================================================
        function showToast(message, type) {
            type = type || 'success';
            const toast = document.getElementById('toast');
            const text = document.getElementById('toastText');
            const icon = toast.querySelector('i');

            text.textContent = message;

            if (type === 'success') {
                icon.className = 'ph ph-check-circle';
                toast.className = 'toast success';
            } else if (type === 'error') {
                icon.className = 'ph ph-x-circle';
                toast.className = 'toast error';
            } else {
                icon.className = 'ph ph-info';
                toast.className = 'toast';
            }

            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(function() {
                toast.classList.remove('show');
            }, 3000);
        }
        window.showToast = showToast;

        // ============================================================
        // LOGOUT — unchanged
        // ============================================================
        function logout() {
            if (confirm('Voulez-vous vraiment vous déconnecter ?')) {
                localStorage.removeItem('authToken');
                sessionStorage.removeItem('authToken');
                window.location.href = 'login.html';
            }
        }
        window.logout = logout;

                    // Insert before the delete button (if exists) or at the end
                    const deleteBtn = actionsDiv.querySelector('.action-btn.danger');
                    if (deleteBtn) {
                        actionsDiv.insertBefore(editBtn, deleteBtn);
                    } else {
                        actionsDiv.appendChild(editBtn);
                    }
                });
            }, 100);
        });
    </script>
